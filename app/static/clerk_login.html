<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LanderAI Clerk Login</title>
    <style>
      :root {
        color: #202124;
        background: #f7f7f4;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 16px;
        color: #5f6368;
        line-height: 1.5;
      }

      section {
        margin-top: 18px;
        padding: 18px;
        border: 1px solid #d8d7cf;
        border-radius: 8px;
        background: #fff;
      }

      button {
        min-height: 38px;
        border: 1px solid #2f5d50;
        border-radius: 6px;
        background: #2f5d50;
        color: #fff;
        padding: 0 14px;
        font-weight: 700;
        cursor: pointer;
      }

      label {
        display: grid;
        gap: 6px;
        margin-top: 10px;
        color: #3c4043;
        font-weight: 700;
      }

      input {
        box-sizing: border-box;
        width: min(420px, 100%);
        min-height: 38px;
        border: 1px solid #c9c7bf;
        border-radius: 6px;
        padding: 0 10px;
        font: inherit;
      }

      button.secondary {
        background: #fff;
        color: #2f5d50;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }

      pre {
        min-height: 90px;
        max-height: 300px;
        overflow: auto;
        border-radius: 8px;
        background: #1f2328;
        color: #e6edf3;
        padding: 14px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .warning {
        border-color: #c27a1a;
        background: #fff8e8;
        color: #6f4200;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Clerk Login Token Test</h1>
      <p>로그인 후 session token을 복사하거나, 바로 백엔드 인증 API를 호출할 수 있습니다.</p>

      <section id="status">Loading Clerk config...</section>
      <section id="sign-in">
        <form id="email-login-form">
          <label>
            Email
            <input id="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <div class="actions">
            <button type="submit">Sign In With Email</button>
            <button id="show-clerk-ui" class="secondary" type="button">Use Clerk UI</button>
            <button id="send-email-code" class="secondary" type="button">Send Email Code</button>
          </div>
        </form>
        <form id="email-code-form" hidden>
          <label>
            Email Code
            <input id="email-code" type="text" inputmode="numeric" autocomplete="one-time-code" />
          </label>
          <div class="actions">
            <button type="submit">Verify Code</button>
          </div>
        </form>
        <div id="clerk-sign-in-ui" hidden></div>
      </section>

      <section>
        <div class="actions">
          <button id="refresh-token" disabled>Get Token</button>
          <button id="test-users" class="secondary" disabled>Test GET /api/v1/users</button>
          <button id="delete-users" class="secondary" disabled>Test DELETE /api/v1/users</button>
          <button id="sign-out" class="secondary" disabled>Sign Out</button>
        </div>
        <pre id="output">No token yet.</pre>
      </section>
    </main>

    <script>
      const statusEl = document.querySelector("#status");
      const signInEl = document.querySelector("#sign-in");
      const outputEl = document.querySelector("#output");
      const refreshTokenButton = document.querySelector("#refresh-token");
      const testUsersButton = document.querySelector("#test-users");
      const deleteUsersButton = document.querySelector("#delete-users");
      const signOutButton = document.querySelector("#sign-out");
      const emailLoginForm = document.querySelector("#email-login-form");
      const emailCodeForm = document.querySelector("#email-code-form");
      const emailInput = document.querySelector("#email");
      const passwordInput = document.querySelector("#password");
      const emailCodeInput = document.querySelector("#email-code");
      const showClerkUiButton = document.querySelector("#show-clerk-ui");
      const sendEmailCodeButton = document.querySelector("#send-email-code");
      const clerkSignInUi = document.querySelector("#clerk-sign-in-ui");

      let clerk;
      let currentToken = "";
      let pendingEmailCodeSignIn = null;

      function showOutput(value) {
        outputEl.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      function showError(error) {
        showOutput({
          message: error.message,
          errors: error.errors || [],
        });
      }

      function loadScript(src, attributes = {}) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.async = true;
          script.crossOrigin = "anonymous";
          script.src = src;
          for (const [key, value] of Object.entries(attributes)) {
            script.setAttribute(key, value);
          }
          script.onload = resolve;
          script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
          document.head.appendChild(script);
        });
      }

      function getClerkFrontendApi(publishableKey) {
        const encodedFrontendApi = publishableKey.split("_")[2];
        if (!encodedFrontendApi) {
          throw new Error("CLERK_PUBLISHABLE_KEY 형식이 올바르지 않습니다.");
        }
        return atob(encodedFrontendApi).replace(/\$$/, "");
      }

      async function loadClerk(config) {
        const publishableKey = config.clerk_publishable_key;
        const frontendApi = getClerkFrontendApi(publishableKey);

        await loadScript(`https://${frontendApi}/npm/@clerk/ui@1/dist/ui.browser.js`);
        await loadScript(
          `https://${frontendApi}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`,
          {
            "data-clerk-publishable-key": publishableKey,
          },
        );

        if (!window.Clerk) {
          throw new Error("Clerk JS를 불러왔지만 window.Clerk 객체가 없습니다.");
        }

        clerk = window.Clerk;
        await clerk.load({
          ui: {
            ClerkUI: window.__internal_ClerkUICtor,
          },
        });

        if (!clerk.client) {
          throw new Error("Clerk client가 초기화되지 않았습니다. Publishable key와 Clerk authorized party 설정을 확인하세요.");
        }
      }

      async function getSessionToken() {
        if (!clerk || !clerk.session) {
          throw new Error("No active Clerk session.");
        }
        currentToken = await clerk.session.getToken();
        showOutput(currentToken);
        return currentToken;
      }

      async function callApi(method, path) {
        const token = currentToken || (await getSessionToken());
        const response = await fetch(path, {
          method,
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });
        const body = await response.json().catch(() => response.text());
        showOutput({
          status: response.status,
          body,
        });
      }

      async function updateUi() {
        if (clerk.user) {
          emailLoginForm.hidden = true;
          emailCodeForm.hidden = true;
          clerkSignInUi.hidden = true;
          statusEl.textContent = `Signed in as ${clerk.user.primaryEmailAddress?.emailAddress || clerk.user.id}`;
          refreshTokenButton.disabled = false;
          testUsersButton.disabled = false;
          deleteUsersButton.disabled = false;
          signOutButton.disabled = false;
          await getSessionToken();
          return;
        }

        statusEl.textContent = "Signed out.";
        refreshTokenButton.disabled = true;
        testUsersButton.disabled = true;
        deleteUsersButton.disabled = true;
        signOutButton.disabled = true;
        currentToken = "";
        pendingEmailCodeSignIn = null;
        showOutput("No token yet.");
        emailLoginForm.hidden = false;
        emailCodeForm.hidden = true;
        clerkSignInUi.hidden = true;
      }

      async function createSignIn() {
        if (!clerk || !clerk.client) {
          throw new Error("Clerk client가 아직 준비되지 않았습니다.");
        }
        return clerk.client.signIn.create({
          identifier: emailInput.value.trim(),
        });
      }

      async function signInWithEmailPassword(event) {
        event.preventDefault();
        showOutput("Signing in...");

        const signIn = await createSignIn();

        const passwordFactor = signIn.supportedFirstFactors?.find(
          (factor) => factor.strategy === "password",
        );

        if (!passwordFactor) {
          showOutput({
            status: signIn.status,
            message: "Password sign-in is not enabled for this Clerk application.",
            supportedFirstFactors: signIn.supportedFirstFactors || [],
          });
          return;
        }

        const completedSignIn = await signIn.attemptFirstFactor({
          strategy: "password",
          password: passwordInput.value,
        });

        if (completedSignIn.status !== "complete") { 
          if (completedSignIn.status === "needs_client_trust") {
            emailLoginForm.hidden = true;
            clerkSignInUi.hidden = false;
            clerk.mountSignIn(clerkSignInUi);
          }

          showOutput({
            status: completedSignIn.status,
            message: "Additional verification is required in Clerk. Use the Clerk UI below to complete sign-in.",
            supportedFirstFactors: completedSignIn.supportedFirstFactors || [],
          });
          return;
        }

        await clerk.setActive({ session: completedSignIn.createdSessionId });
        await updateUi();
      }

      async function sendEmailCode() {
        showOutput("Sending email code...");

        const signIn = await createSignIn();
        const emailCodeFactor = signIn.supportedFirstFactors?.find(
          (factor) => factor.strategy === "email_code",
        );

        if (!emailCodeFactor) {
          showOutput({
            status: signIn.status,
            message: "Email code sign-in is not enabled for this Clerk application.",
            supportedFirstFactors: signIn.supportedFirstFactors || [],
          });
          return;
        }

        pendingEmailCodeSignIn = await signIn.prepareFirstFactor({
          strategy: "email_code",
          emailAddressId: emailCodeFactor.emailAddressId,
        });

        emailCodeForm.hidden = false;
        emailCodeInput.focus();
        showOutput({
          status: pendingEmailCodeSignIn.status,
          message: "Email code sent. Enter the code below.",
        });
      }

      function showClerkSignInUi() {
        if (!clerk) {
          throw new Error("Clerk가 아직 준비되지 않았습니다.");
        }
        emailLoginForm.hidden = true;
        emailCodeForm.hidden = true;
        clerkSignInUi.hidden = false;
        clerk.mountSignIn(clerkSignInUi);
        showOutput("Use the Clerk UI below with the same email and password.");
      }

      async function verifyEmailCode(event) {
        event.preventDefault();
        if (!pendingEmailCodeSignIn) {
          throw new Error("Send an email code first.");
        }

        const completedSignIn = await pendingEmailCodeSignIn.attemptFirstFactor({
          strategy: "email_code",
          code: emailCodeInput.value.trim(),
        });

        if (completedSignIn.status !== "complete") {
          showOutput({
            status: completedSignIn.status,
            message: "Additional verification is required in Clerk.",
          });
          return;
        }

        await clerk.setActive({ session: completedSignIn.createdSessionId });
        await updateUi();
      }

      async function boot() {
        const config = await fetch("/api/v1/auth/config").then((response) => response.json());
        if (!config.clerk_publishable_key) {
          statusEl.className = "warning";
          statusEl.textContent = "Lambda 환경변수 또는 Terraform var.clerk_publishable_key에 CLERK_PUBLISHABLE_KEY=pk_test_... 값을 추가해야 합니다.";
          signInEl.hidden = true;
          return;
        }

        await loadClerk(config);
        await updateUi();
      }

      refreshTokenButton.addEventListener("click", () => getSessionToken().catch(showError));
      testUsersButton.addEventListener("click", () => callApi("GET", "/api/v1/users").catch(showError));
      deleteUsersButton.addEventListener("click", () => callApi("DELETE", "/api/v1/users").catch(showError));
      emailLoginForm.addEventListener("submit", (event) => signInWithEmailPassword(event).catch(showError));
      showClerkUiButton.addEventListener("click", () => {
        try {
          showClerkSignInUi();
        } catch (error) {
          showError(error);
        }
      });
      sendEmailCodeButton.addEventListener("click", () => sendEmailCode().catch(showError));
      emailCodeForm.addEventListener("submit", (event) => verifyEmailCode(event).catch(showError));
      signOutButton.addEventListener("click", () => {
        Promise.resolve()
          .then(async () => {
            await clerk.signOut();
            await updateUi();
          })
          .catch(showError);
      });

      boot().catch((error) => {
        statusEl.className = "warning";
        statusEl.textContent = error.message;
        showError(error);
      });
    </script>
  </body>
</html>
