name: Deploy Lambda

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  PYTHON_VERSION: "3.12"
  LAMBDA_ARCH_PLATFORM: manylinux2014_aarch64
  PROJECT_NAME: landerai
  DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  LAMBDA_NAMES: >-
    api_lambda
    embedding_lambda
    design_plan_lambda
    landing_page_variant_lambda
    persist_result_lambda
    revision_worker_lambda

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: landerai-${{ env.DEPLOY_ENV }}-be-lambda-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda package
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/lambda-package

          python -m pip install \
            -r requirements.txt \
            --target build/lambda-package \
            --platform "${LAMBDA_ARCH_PLATFORM}" \
            --implementation cp \
            --python-version 3.12 \
            --abi cp312 \
            --only-binary=:all: \
            --upgrade

          cp -R app build/lambda-package/app

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          package_dir = Path("build/lambda-package")
          zip_path = Path("build/landerai-be-lambda.zip")

          with ZipFile(zip_path, "w", ZIP_DEFLATED) as zf:
              for path in package_dir.rglob("*"):
                  if path.is_file():
                      zf.write(path, path.relative_to(package_dir).as_posix())

          print(zip_path.resolve())
          print(zip_path.stat().st_size)
          PY

      - name: Deploy Lambda package
        run: |
          set -euo pipefail
          for lambda_name in ${LAMBDA_NAMES}; do
            function_name="${PROJECT_NAME}-${DEPLOY_ENV}-${lambda_name}"

            aws lambda update-function-code \
              --function-name "${function_name}" \
              --zip-file fileb://build/landerai-be-lambda.zip \
              --region "${AWS_REGION}"

            aws lambda wait function-updated \
              --function-name "${function_name}" \
              --region "${AWS_REGION}"
          done
